<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0B2545"/>
  <!-- Code bracket < -->
  <polyline points="10,22 4,32 10,42" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Code bracket > -->
  <polyline points="24,22 30,32 24,42" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Growth path / chart line -->
  <polyline points="34,44 40,36 46,40 54,26" stroke="url(#tealGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Dots on the path -->
  <circle cx="34" cy="44" r="3" fill="#14B8A6"/>
  <circle cx="46" cy="40" r="3" fill="#2E74B5"/>
  <circle cx="54" cy="26" r="3" fill="#3B82F6"/>
  <!-- Arrow tip at end -->
  <polyline points="50,23 54,26 51,30" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <defs>
    <linearGradient id="tealGrad" x1="34" y1="44" x2="54" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>
